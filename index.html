        // Enhanced WebRTC Call Functions
        async function initializeWebRTC() {
            try {
                // Enhanced STUN/TURN servers configuration
                const configuration = {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' }
                    ],
                    iceCandidatePoolSize: 10
                };
                
                peerConnection = new RTCPeerConnection(configuration);
                
                // Enhanced event handlers
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('🔗 ICE candidate generated');
                        // In production, send this to the other peer via signaling server
                    }
                };
                
                peerConnection.ontrack = (event) => {
                    console.log('📹 Remote stream received');
                    remoteVideo.srcObject = event.streams[0];
                    remoteStream = event.streams[0];
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log('🔄 Connection state:', peerConnection.connectionState);
                    if (peerConnection.connectionState === 'connected') {
                        console.log('✅ WebRTC connection established');
                    } else if (peerConnection.connectionState === 'failed') {
                        console.log('❌ WebRTC connection failed');
                        showError('فشل في الاتصال');
                    }
                };

                peerConnection.oniceconnectionstatechange = () => {
                    console.log('🧊 ICE connection state:', peerConnection.iceConnectionState);
                };
                
                return true;
            } catch (error) {
                console.error('❌ خطأ في تهيئة WebRTC:', error);
                return false;
            }
        }

        // Check WebRTC support
        function checkWebRTCSupport() {
            const hasWebRTC = !!(navigator.mediaDevices && 
                               navigator.mediaDevices.getUserMedia && 
                               window.RTCPeerConnection);
            
            const hasGetUserMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
            
            console.log('📱 WebRTC Support:', hasWebRTC);
            console.log('🎥 getUserMedia Support:', hasGetUserMedia);
            
            return hasWebRTC && hasGetUserMedia;
        }

        // Enhanced media constraints for different devices
        function getMediaConstraints(isVideo = false, isMobile = false) {
            const constraints = {
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                    sampleRate: 44100
                }
            };

            if (isVideo) {
                if (isMobile) {
                    // Mobile-optimized video settings
                    constraints.video = {
                        width: { ideal: 640, max: 1280 },
                        height: { ideal: 480, max: 720 },
                        frameRate: { ideal: 15, max: 30 },
                        facingMode: 'user'
                    };
                } else {
                    // Desktop video settings
                    constraints.video = {
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 },
                        frameRate: { ideal: 30, max: 60 }
                    };
                }
            }

            return constraints;
        }

        async function startCall(isVideo = false) {
            if (!currentChatUserId) {
                showError('يرجى اختيار محادثة أولاً');
                return;
            }

            // Check WebRTC support first
            if (!checkWebRTCSupport()) {
                showError('المتصفح لا يدعم المكالمات الصوتية أو المرئية');
                return;
            }

            try {
                console.log(`🚀 بدء ${isVideo ? 'مكالمة فيديو' : 'مكالمة صوتية'}...`);
                
                // Initialize WebRTC
                const webRTCReady = await initializeWebRTC();
                if (!webRTCReady) {
                    showError('فشل في تهيئة نظام المكالمات');
                    return;
                }

                // Detect if mobile device
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // Get optimized media constraints
                const constraints = getMediaConstraints(isVideo, isMobile);
                
                console.log('🎥 طلب الوصول للكاميرا والميكروفون...');
                
                // Request user media with enhanced error handling
                try {
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    console.log('✅ تم الحصول على الوسائط المحلية');
                } catch (mediaError) {
                    console.error('❌ خطأ في الوصول للوسائط:', mediaError);
                    
                    // Try with basic constraints if enhanced ones fail
                    const basicConstraints = { audio: true, video: isVideo };
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia(basicConstraints);
                        console.log('✅ تم الحصول على الوسائط المحلية (إعدادات أساسية)');
                    } catch (basicError) {
                        throw basicError;
                    }
                }

                localVideo.srcObject = localStream;

                // Add tracks to peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                    console.log(`➕ تم إضافة مسار ${track.kind}`);
                });

                // Create offer for the call
                try {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    console.log('📤 تم إنشاء العرض المحلي');
                } catch (offerError) {
                    console.error('❌ خطأ في إنشاء العرض:', offerError);
                }

                // Show incoming call notification to simulate receiving end
                setTimeout(() => {
                    showIncomingCallNotification(isVideo);
                }, 1000);

                isInCall = true;
                updateCallButtons(true);

                // Save call info to messages (optional)
                const callMessage = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                    senderId: currentUser.id,
                    receiverId: currentChatUserId,
                    text: `${isVideo ? '📹 مكالمة فيديو' : '📞 مكالمة صوتية'} - ${formatTime(Date.now())}`,
                    timestamp: Date.now(),
                    file: null,
                    type: 'call'
                };

                await saveMessage(callMessage);
                renderMessage(callMessage);

            } catch (error) {
                console.error('❌ خطأ في بدء المكالمة:', error);
                
                // Provide specific error messages
                if (error.name === 'NotAllowedError') {
                    showError('يرجى السماح بالوصول للكاميرا والميكروفون');
                } else if (error.name === 'NotFoundError') {
                    showError('لم يتم العثور على كاميرا أو ميكروفون');
                } else if (error.name === 'NotReadableError') {
                    showError('الكاميرا أو الميكروفون مستخدم من تطبيق آخر');
                } else {
                    showError('فشل في بدء المكالمة - تأكد من إعدادات المتصفح');
                }
                
                // Clean up on error
                endCall();
            }
        }

        function showIncomingCallNotification(isVideo) {
            const otherUser = allUsers.find(u => u.id === currentChatUserId);
            if (!otherUser) return;

            const callNotification = document.createElement('div');
            callNotification.className = 'incoming-call-notification';
            callNotification.innerHTML = `
                <div class="call-notification-content">
                    <div class="caller-info">
                        <div class="caller-avatar">
                            ${otherUser.avatar ? `<img src="${otherUser.avatar}" alt="${otherUser.name}">` : getInitials(otherUser.name)}
                        </div>
                        <div class="caller-details">
                            <h3>${otherUser.name}</h3>
                            <p class="call-type">${isVideo ? 'مكالمة فيديو واردة' : 'مكالمة صوتية واردة'}</p>
                        </div>
                    </div>
                    <div class="call-actions">
                        <button class="accept-call-btn" onclick="acceptCall(${isVideo})">📞</button>
                        <button class="decline-call-btn" onclick="declineCall()">📵</button>
                    </div>
                </div>
            `;
            document.body.appendChild(callNotification);

            // Auto-remove after 30 seconds
            setTimeout(() => {
                if (document.body.contains(callNotification)) {
                    declineCall();
                }
            }, 30000);
        }

        window.acceptCall = function(isVideo) {
            document.querySelector('.incoming-call-notification')?.remove();
            
            if (isVideo) {
                videoCallOverlay.classList.remove('hidden');
                const otherUser = allUsers.find(u => u.id === currentChatUserId);
                document.getElementById('callParticipantName').textContent = otherUser ? otherUser.name : 'مكالمة فيديو';
            }
            
            startCallTimer();
            isInCall = true;
            updateCallButtons(true);
        };

        window.declineCall = function() {
            document.querySelector('.incoming-call-notification')?.remove();
            endCall();
        };

        function startCallTimer() {
            callStartTime = Date.now();
            callTimer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                const durationElement = document.getElementById('callDuration');
                if (durationElement) {
                    durationElement.textContent = timeString;
                }
            }, 1000);
        }

        function endCall() {
            console.log('📵 إنهاء المكالمة...');
            
            // Clean up WebRTC streams
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    track.stop();
                    console.log(`⏹️ تم إيقاف مسار ${track.kind}`);
                });
                localStream = null;
            }
            
            if (remoteStream) {
                remoteStream.getTracks().forEach(track => {
                    track.stop();
                });
                remoteStream = null;
            }
            
            // Clean up peer connection
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
                console.log('🔌 تم إغلاق اتصال WebRTC');
            }

            // Clean up UI elements
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            videoCallOverlay.classList.add('hidden');
            
            // Reset call controls
            document.getElementById('toggleMic').classList.remove('muted');
            document.getElementById('toggleMic').textContent = '🎤';
            document.getElementById('toggleCamera').classList.remove('off');
            document.getElementById('toggleCamera').textContent = '📹';
            document.getElementById('toggleScreen').classList.remove('active');
            document.getElementById('toggleScreen').textContent = '🖥️';
            
            // Clear call timer
            if (callTimer) {
                clearInterval(callTimer);
                callTimer = null;
                callStartTime = null;
            }

            // Reset call duration display
            const durationElement = document.getElementById('callDuration');
            if (durationElement) {
                durationElement.textContent = '00:00';
            }

            // Update call state
            isInCall = false;
            updateCallButtons(false);
            
            // Remove any call notifications
            document.querySelector('.incoming-call-notification')?.remove();
            
            console.log('✅ تم إنهاء المكالمة بنجاح');
        }

        function updateCallButtons(inCall) {
            const audioBtn = document.getElementById('audioCallBtn');
            const videoBtn = document.getElementById('videoCallBtn');
            
            if (inCall) {
                audioBtn.classList.add('active');
                videoBtn.classList.add('active');
                audioBtn.title = 'إنهاء المكالمة';
                videoBtn.title = 'إنهاء المكالمة';
            } else {
                audioBtn.classList.remove('active');
                videoBtn.classList.remove('active');
                audioBtn.title = 'مكالمة صوتية';
                videoBtn.title = 'مكالمة فيديو';
            }
        }

        // Call Control Event Listeners
        document.getElementById('audioCallBtn').addEventListener('click', () => {
            if (isInCall) {
                endCall();
            } else {
                startCall(false);
            }
        });

        document.getElementById('videoCallBtn').addEventListener('click', () => {
            if (isInCall) {
                endCall();
            } else {
                startCall(true);
            }
        });

        document.getElementById('toggleMic').addEventListener('click', function() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    this.classList.toggle('muted', !audioTrack.enabled);
                    this.textContent = audioTrack.enabled ? '🎤' : '🔇';
                }
            }
        });

        document.getElementById('toggleCamera').addEventListener('click', function() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    this.classList.toggle('off', !videoTrack.enabled);
                    this.textContent = videoTrack.enabled ? '📹' : '📷';
                }
            }
        });

        document.getElementById('toggleScreen').addEventListener('click', async function() {
            try {
                if (!this.classList.contains('active')) {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const videoTrack = screenStream.getVideoTracks()[0];
                    
                    if (peerConnection && localStream) {
                        const sender = peerConnection.getSenders().find(s => 
                            s.track && s.track.kind === 'video'
                        );
                        if (sender) {
                            await sender.replaceTrack(videoTrack);
                        }
                    }
                    
                    this.classList.add('active');
                    this.textContent = '🛑';
                    
                    videoTrack.onended = () => {
                        this.classList.remove('active');
                        this.textContent = '🖥️';
                    };
                } else {
                    // Stop screen sharing
                    if (localStream) {
                        const videoTrack = localStream.getVideoTracks()[0];
                        if (peerConnection) {
                            const sender = peerConnection.getSenders().find(s => 
                                s.track && s.track.kind === 'video'
                            );
                            if (sender && videoTrack) {
                                await sender.replaceTrack(videoTrack);
                            }
                        }
                    }
                    this.classList.remove('active');
                    this.textContent = '🖥️';
                }
            } catch (error) {
                console.error('خطأ في مشاركة الشاشة:', error);
                showError('فشل في مشاركة الشاشة');
            }
        });

        document.getElementById('endCall').addEventListener('click', endCall);

        document.getElementById('minimizeCall').addEventListener('click', () => {
            videoCallOverlay.classList.add('hidden');
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Initialize app
        window.addEventListener('load', async () => {
            console.log('🚀 بدء تشغيل المنصة...');
            
            // Initialize Data SDK first
            await initDataSdk();
            
            // Try auto login after data is loaded
            setTimeout(async () => {
                const autoLoggedIn = await autoLogin();
                if (!autoLoggedIn) {
                    console.log('لم يتم العثور على مستخدم محفوظ');
                }
            }, 1000);
        });
    </script>
