  <script>
        const defaultConfig = {
            academy_name: 'أكاديمية Alif-Lam-Meem',
            teacher_name: 'أ. ساره عبدالطيف محمود بحيرى'
        };

        let config = { ...defaultConfig };

        let currentUser = null;
        let allUsers = [];
        let currentChatUserId = null;

        // Real API Storage Configuration
        const API_CONFIG = {
            binId: '690a2a5a43b1c97be9989174',
            apiKey: '$2a$10$hJudGjs2DM9GszivDobyS.5YXXS8HRiPobc9XxhYDUM5dtZQ81dE2',
            baseUrl: 'https://api.jsonbin.io/v3/b'
        };

        // Default data structure
        const defaultData = {
            users: [
                {
                    id: '1',
                    name: 'أ. ساره عبدالطيف محمود بحيرى',
                    email: 'teacher@alif-lam-meem.com',
                    password: '123456',
                    avatar: null,
                    isTeacher: true,
                    createdAt: Date.now()
                }
            ],
            chats: {},
            lastUpdated: Date.now()
        };

        // API Status Management
        function updateApiStatus(isOnline) {
            const statusElement = document.getElementById('apiStatus');
            if (isOnline) {
                statusElement.className = 'api-status online';
                statusElement.textContent = '🟢 متصل بالخادم';
            } else {
                statusElement.className = 'api-status offline';
                statusElement.textContent = '🔴 غير متصل';
            }
        }

        // Load data from real API
        async function loadData() {
            try {
                updateApiStatus(false);
                
                const response = await fetch(`${API_CONFIG.baseUrl}/${API_CONFIG.binId}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': API_CONFIG.apiKey,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    updateApiStatus(true);
                    console.log('✅ تم تحميل البيانات من الخادم بنجاح');
                    return result.record || defaultData;
                } else {
                    console.log('⚠️ فشل تحميل البيانات، استخدام البيانات الافتراضية');
                    updateApiStatus(false);
                    return defaultData;
                }
            } catch (error) {
                console.log('❌ خطأ في الاتصال بالخادم:', error.message);
                updateApiStatus(false);
                return defaultData;
            }
        }

        // Save data to real API
        async function saveData(data) {
            try {
                data.lastUpdated = Date.now();
                
                const response = await fetch(`${API_CONFIG.baseUrl}/${API_CONFIG.binId}`, {
                    method: 'PUT',
                    headers: {

        // Create realistic ringtone
        function createRingtone() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.8);
            } catch (error) {
                console.log('Audio not supported');
            }
        }

        function startRinging() {

        function renderMessage(message) {

            let content = message.text;

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            content = content.replace(urlRegex, (url) => {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="message-link">${url}</a>`;
            });

            let fileHtml = '';
            if (message.file) {
                if (message.file.type === 'image') {
                    fileHtml = `<img src="${message.file.data}" alt="صورة" class="message-image" onclick="openImageModal('${message.file.data}')">`;
                } else {
                    fileHtml = `

                            <div class="file-info">

                                <div class="file-size">${message.file.size}</div>
                            </div>
                        </div>
                    `;
                }
            }

            div.innerHTML = `
                <div class="message-content">
                    <div>${content}</div>
                    ${fileHtml}
                    <div class="message-time">${formatTime(message.timestamp)}</div>
                </div>
            `;

            messagesContainer.appendChild(div);

                this.classList.remove('active');
                this.textContent = '📞';
                this.title = 'مكالمة صوتية';
                hideCallInterface();
                
                micEnabled = true;
                cameraEnabled = true;
                screenSharing = false;
                document.getElementById('micBtn').classList.remove('muted');
                document.getElementById('cameraBtn').classList.remove('muted');
                document.getElementById('screenShareBtn').classList.remove('active');
                document.getElementById('micBtn').textContent = '🎤';
                document.getElementById('cameraBtn').textContent = '📹';
                document.getElementById('screenShareBtn').textContent = '🖥️';
            }
            
            if (audioCallActive && videoCallActive) {
                document.getElementById('videoCallBtn').click();
            }
        });

        document.getElementById('videoCallBtn').addEventListener('click', function() {
            if (!videoCallActive) {
                this.disabled = true;
                this.textContent = '📺';
                this.title = 'جاري الاتصال...';
                
                startRinging();
                
                setTimeout(() => {
                    stopRinging();
                    videoCallActive = true;
                    this.classList.add('active');
                    this.textContent = '📴';
                    this.title = 'إنهاء مكالمة الفيديو';
                    this.disabled = false;
                    showCallInterface();
                }, 3000);
            } else {
                videoCallActive = false;
                this.classList.remove('active');
                this.textContent = '📺';
                this.title = 'مكالمة فيديو';
                hideCallInterface();
                
                micEnabled = true;
                cameraEnabled = true;
                screenSharing = false;
                document.getElementById('micBtn').classList.remove('muted');
                document.getElementById('cameraBtn').classList.remove('muted');
                document.getElementById('screenShareBtn').classList.remove('active');
                document.getElementById('micBtn').textContent = '🎤';
                document.getElementById('cameraBtn').textContent = '📹';
                document.getElementById('screenShareBtn').textContent = '🖥️';
            }
            
            if (videoCallActive && audioCallActive) {
                document.getElementById('audioCallBtn').click();
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Initialize app
        window.addEventListener('load', async () => {
            loadSavedLoginData();
            
            // Test API connection on load
            console.log('🚀 بدء تشغيل المنصة...');
            try {
                await loadData();
                console.log('✅ تم الاتصال بالخادم بنجاح');
            } catch (error) {
                console.log('⚠️ تعذر الاتصال بالخادم، سيتم العمل في وضع عدم الاتصال');
            }
        });
    </script>
