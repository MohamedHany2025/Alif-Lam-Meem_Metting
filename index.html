<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التواصل التعليمية</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6264a7 0%, #464775 100%);
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        * {
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        .container {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 420px;
            max-width: 90%;
            padding: 40px;
            margin: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-container {
            background: #f3f2f1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
            border-radius: 0;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #6264a7;
            font-size: 28px;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .logo p {
            color: #605e5c;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #323130;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #edebe9;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6264a7;
            box-shadow: 0 0 0 1px #6264a7;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #6264a7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #464775;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch-mode {
            text-align: center;
            margin-top: 20px;
            color: #605e5c;
            font-size: 14px;
        }

        .switch-mode a {
            color: #6264a7;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fde7e9;
            color: #a4262c;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #f1aeb5;
        }

        .success-message {
            background: #dff6dd;
            color: #107c10;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #9fd89f;
        }

        .hidden {
            display: none !important;
        }

        /* Teams-like Chat Styles */
        .chat-header {
            background: #6264a7;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #6264a7;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-header-info h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header-info p {
            margin: 2px 0 0 0;
            font-size: 12px;
            opacity: 0.9;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .call-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .call-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .call-btn.active {
            background: #c4314b;
        }

        .call-btn.muted {
            background: #ff8c00;
        }

        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .chat-sidebar {
            width: 280px;
            background: white;
            border-left: 1px solid #edebe9;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid #edebe9;
            background: #faf9f8;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #323130;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-list-item {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-list-item:hover {
            background: #f3f2f1;
        }

        .chat-list-item.active {
            background: #e1dfdd;
        }

        .chat-list-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #6264a7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            position: relative;
        }

        .chat-list-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-indicator {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #107c10;
            border: 2px solid white;
            border-radius: 50%;
        }

        .chat-list-info h4 {
            margin: 0 0 2px 0;
            font-size: 14px;
            font-weight: 600;
            color: #323130;
        }

        .chat-list-info p {
            margin: 0;
            font-size: 12px;
            color: #605e5c;
        }

        .chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #faf9f8;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #6264a7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .message.sent .message-avatar {
            margin-left: 0;
            margin-right: 8px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            position: relative;
        }

        .message.received .message-bubble {
            background: white;
            color: #323130;
            border: 1px solid #edebe9;
            border-bottom-right-radius: 8px;
        }

        .message.sent .message-bubble {
            background: #6264a7;
            color: white;
            border-bottom-left-radius: 8px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .message-link {
            color: inherit;
            text-decoration: underline;
            word-break: break-all;
        }

        .message.sent .message-link {
            color: white;
        }

        .message-file {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            margin-top: 4px;
        }

        .message.sent .message-file {
            background: rgba(255, 255, 255, 0.2);
        }

        .file-icon {
            font-size: 20px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            font-size: 12px;
        }

        .file-size {
            font-size: 10px;
            opacity: 0.8;
        }

        .message-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            margin-top: 4px;
            cursor: pointer;
        }

        .chat-input-container {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #edebe9;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: #f3f2f1;
            border-radius: 4px;
            padding: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
            color: #323130;
        }

        .chat-input:focus {
            outline: none;
        }

        .chat-input::placeholder {
            color: #a19f9d;
        }

        .input-actions {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            color: #605e5c;
        }

        .icon-btn:hover {
            background: #edebe9;
        }

        .send-btn {
            background: #6264a7;
            color: white;
        }

        .send-btn:hover {
            background: #464775;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-input {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #a19f9d;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: #605e5c;
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .empty-state p {
            color: #a19f9d;
            margin: 0;
            font-size: 14px;
        }

        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #605e5c;
        }

        .spinner {
            border: 3px solid #f3f2f1;
            border-top: 3px solid #6264a7;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Video Call Interface */
        .video-call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1b1a19;
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }

        .video-call-header {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-call-info h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .video-call-info p {
            margin: 4px 0 0 0;
            font-size: 12px;
            opacity: 0.8;
        }

        .video-call-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #323130;
        }

        .self-video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            background: #323130;
            border: 2px solid white;
        }

        .video-call-controls {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .video-call-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
            color: white;
        }

        .video-call-btn.mic {
            background: #6264a7;
        }

        .video-call-btn.mic.muted {
            background: #c4314b;
        }

        .video-call-btn.camera {
            background: #6264a7;
        }

        .video-call-btn.camera.off {
            background: #c4314b;
        }

        .video-call-btn.screen {
            background: #6264a7;
        }

        .video-call-btn.screen.active {
            background: #107c10;
        }

        .video-call-btn.end {
            background: #c4314b;
        }

        .video-call-btn:hover {
            transform: scale(1.1);
        }

        /* Incoming Call Notification */
        .incoming-call-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 3000;
            padding: 32px;
            min-width: 320px;
            animation: callPulse 2s infinite;
        }

        @keyframes callPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
        }

        .call-notification-content {
            text-align: center;
        }

        .caller-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .caller-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #6264a7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
        }

        .caller-details h3 {
            margin: 0 0 4px 0;
            color: #323130;
            font-size: 20px;
            font-weight: 600;
        }

        .caller-details p {
            margin: 0;
            color: #605e5c;
            font-size: 14px;
        }

        .call-type {
            color: #6264a7;
            font-weight: 600;
            font-size: 16px;
        }

        .call-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .accept-call-btn, .decline-call-btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .accept-call-btn {
            background: #107c10;
            color: white;
        }

        .accept-call-btn:hover {
            background: #0e6e0e;
            transform: scale(1.1);
        }

        .decline-call-btn {
            background: #c4314b;
            color: white;
        }

        .decline-call-btn:hover {
            background: #a52c42;
            transform: scale(1.1);
        }

        .connection-status {
            display: none;
        }

        /* Responsive Design for All Devices */
        @media (max-width: 480px) {
            /* Mobile phones */
            .auth-box {
                padding: 20px;
                border-radius: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin: 0;
            }

            .logo h1 {
                font-size: 24px;
            }

            .chat-container {
                height: 100%;
                width: 100%;
                border-radius: 0;
            }

            .chat-main {
                flex-direction: column;
            }

            .chat-sidebar {
                display: none;
            }

            .message-bubble {
                max-width: 90%;
                font-size: 14px;
            }

            .chat-header {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 6px;
            }

            .chat-header-left {
                gap: 10px;
            }

            .chat-header-right {
                gap: 6px;
            }

            .chat-avatar {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

            .chat-header-info h2 {
                font-size: 13px;
            }

            .chat-header-info p {
                font-size: 10px;
            }

            .header-btn {
                padding: 6px 8px;
                font-size: 11px;
            }

            .call-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .chat-input-container {
                padding: 12px;
            }

            .icon-btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .incoming-call-notification {
                min-width: 260px;
                padding: 20px;
                margin: 0 16px;
            }

            .caller-avatar {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }

            .accept-call-btn, .decline-call-btn {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }

            .self-video {
                width: 100px;
                height: 75px;
                top: 12px;
                right: 12px;
            }

            .video-call-controls {
                padding: 16px;
                gap: 12px;
            }

            .video-call-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            /* Tablets */
            .auth-box {
                padding: 32px;
                border-radius: 8px;
                width: 90%;
                max-width: 500px;
            }

            .chat-main {
                flex-direction: row;
            }

            .chat-sidebar {
                width: 240px;
            }

            .message-bubble {
                max-width: 80%;
            }

            .chat-header {
                padding: 14px 20px;
            }

            .chat-avatar {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            .incoming-call-notification {
                min-width: 320px;
                padding: 28px;
            }

            .caller-avatar {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }

            .self-video {
                width: 140px;
                height: 105px;
                top: 20px;
                right: 20px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            /* Large tablets and small laptops */
            .auth-box {
                padding: 40px;
                width: 450px;
            }

            .chat-sidebar {
                width: 300px;
            }

            .message-bubble {
                max-width: 75%;
            }
        }

        @media (min-width: 1025px) {
            /* Desktop and large screens */
            .auth-box {
                width: 420px;
                padding: 40px;
            }

            .chat-sidebar {
                width: 280px;
            }

            .message-bubble {
                max-width: 70%;
            }
        }

        /* iOS Safari specific fixes */
        @supports (-webkit-touch-callout: none) {
            .container {
                height: 100vh;
                height: -webkit-fill-available;
            }

            .chat-container {
                height: 100vh;
                height: -webkit-fill-available;
            }
        }

        /* Android Chrome specific fixes */
        @media screen and (max-width: 768px) {
            .container {
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container"><!-- Auth Screen -->
   <div id="authScreen" class="auth-box">
    <div class="logo">
     <h1 id="academyNameDisplay">أكاديمية Alif-Lam-Meem</h1>
     <p>منصة التواصل لتحفيظ القرآن الكريم</p>
    </div>
    <div id="errorMessage" class="error-message hidden"></div>
    <div id="successMessage" class="success-message hidden"></div><!-- Login Form -->
    <form id="loginForm">
     <div class="form-group"><label for="loginEmail">البريد الإلكتروني</label> <input type="email" id="loginEmail" required placeholder="أدخل بريدك الإلكتروني">
     </div>
     <div class="form-group"><label for="loginPassword">كلمة المرور</label> <input type="password" id="loginPassword" required placeholder="أدخل كلمة المرور">
     </div><button type="submit" class="btn" id="loginBtn">تسجيل الدخول</button>
     <div class="switch-mode">
      ليس لديك حساب؟ <a id="showRegister">إنشاء حساب جديد</a>
     </div>
    </form><!-- Register Form -->
    <form id="registerForm" class="hidden">
     <div class="form-group"><label for="registerName">الاسم الكامل</label> <input type="text" id="registerName" required placeholder="أدخل اسمك الكامل">
     </div>
     <div class="form-group"><label for="registerEmail">البريد الإلكتروني</label> <input type="email" id="registerEmail" required placeholder="أدخل بريدك الإلكتروني">
     </div>
     <div class="form-group"><label for="registerPassword">كلمة المرور</label> <input type="password" id="registerPassword" required placeholder="أدخل كلمة المرور">
     </div><button type="submit" class="btn" id="registerBtn">إنشاء الحساب</button>
     <div class="switch-mode">
      لديك حساب بالفعل؟ <a id="showLogin">تسجيل الدخول</a>
     </div>
    </form>
   </div><!-- Chat Screen -->
   <div id="chatScreen" class="chat-container hidden">
    <div class="chat-header">
     <div class="chat-header-left">
      <div class="chat-avatar" id="currentUserAvatar">
       👤
      </div>
      <div class="chat-header-info">
       <h2 id="currentUserName">المستخدم</h2>
       <p id="currentUserEmail">user@example.com</p>
      </div>
     </div>
     <div class="chat-header-right"><button class="call-btn" id="audioCallBtn" title="مكالمة صوتية"> 📞 </button> <button class="call-btn" id="videoCallBtn" title="مكالمة فيديو"> 📹 </button> <button class="header-btn" id="logoutBtn"> <span>تسجيل الخروج</span> </button>
     </div>
    </div>
    <div class="chat-main">
     <div class="chat-content">
      <div id="messagesContainer" class="messages-container">
       <div class="loading">
        <div class="spinner"></div>
        <p>جاري تحميل المحادثات...</p>
       </div>
      </div>
      <div class="chat-input-container">
       <div class="chat-input-wrapper"><textarea id="messageInput" class="chat-input" placeholder="اكتب رسالة..." rows="1"></textarea>
        <div class="input-actions"><button type="button" class="icon-btn" id="attachImageBtn" title="إرفاق صورة"> 🖼️ </button> <button type="button" class="icon-btn" id="attachFileBtn" title="إرفاق ملف"> 📎 </button> <button type="button" class="icon-btn send-btn" id="sendBtn" title="إرسال"> ➤ </button>
        </div>
       </div><input type="file" id="imageInput" class="file-input" accept="image/*"> <input type="file" id="fileInput" class="file-input">
      </div>
     </div>
     <div class="chat-sidebar" id="chatSidebar">
      <div class="sidebar-header">
       <h3>المحادثات</h3>
      </div>
      <div class="chat-list" id="chatList"></div>
     </div>
    </div>
   </div>
  </div><!-- Video Call Overlay -->
  <div id="videoCallOverlay" class="video-call-overlay hidden">
   <div class="video-call-header">
    <div class="video-call-info">
     <h3 id="callParticipantName">مكالمة فيديو</h3>
     <p id="callDuration">00:00</p>
    </div><button class="header-btn" id="minimizeCall">تصغير</button>
   </div>
   <div class="video-call-main">
    <div class="video-container">
     <video id="remoteVideo" class="main-video" autoplay playsinline></video>
     <video id="localVideo" class="self-video" autoplay playsinline muted></video>
    </div>
   </div>
   <div class="video-call-controls"><button class="video-call-btn mic" id="toggleMic" title="الميكروفون"> 🎤 </button> <button class="video-call-btn camera" id="toggleCamera" title="الكاميرا"> 📹 </button> <button class="video-call-btn screen" id="toggleScreen" title="مشاركة الشاشة"> 🖥️ </button> <button class="video-call-btn end" id="endCall" title="إنهاء المكالمة"> 📵 </button>
   </div>
  </div><!-- Image Modal -->
  <div id="imageModal" class="image-modal hidden"><button class="image-modal-close" id="closeModal">✕</button> <img id="modalImage" src="" alt="معاينة الصورة">
  </div>
  <script>
        // Configuration
        const defaultConfig = {
            academy_name: 'أكاديمية Alif-Lam-Meem',
            teacher_name: 'أ. ساره عبدالطيف محمود بحيرى'
        };

        let config = { ...defaultConfig };
        let currentUser = null;
        let allUsers = [];
        let currentChatUserId = null;
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let isInCall = false;
        let callStartTime = null;
        let callTimer = null;

        // JSONBin Configuration
        const JSONBIN_CONFIG = {
            API_KEY: '$2a$10$hJudGjs2DM9GszivDobyS.5YXXS8HRiPobc9XxhYDUM5dtZQ81dE2',
            BIN_ID: '690a2a5a43b1c97be9989174',
            BASE_URL: 'https://api.jsonbin.io/v3'
        };

        // Global data storage
        let platformData = {
            users: [],
            messages: [],
            chatRooms: [],
            settings: {
                academy_name: 'أكاديمية Alif-Lam-Meem',
                teacher_name: 'أ. ساره عبدالطيف محمود بحيرى'
            },
            lastUpdated: new Date().toISOString()
        };

        // JSONBin API Functions
        async function loadAllDataFromJSONBin() {
            try {
                const response = await fetch(`${JSONBIN_CONFIG.BASE_URL}/b/${JSONBIN_CONFIG.BIN_ID}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': JSONBIN_CONFIG.API_KEY,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    platformData = {
                        users: data.record.users || [],
                        messages: data.record.messages || [],
                        chatRooms: data.record.chatRooms || [],
                        settings: data.record.settings || platformData.settings,
                        lastUpdated: data.record.lastUpdated || new Date().toISOString()
                    };
                    
                    allUsers = platformData.users;
                    updateConnectionStatus(true);
                    console.log('✅ تم تحميل جميع البيانات من JSONBin');
                    console.log(`📊 المستخدمون: ${platformData.users.length}, الرسائل: ${platformData.messages.length}`);
                    return true;
                } else {
                    console.error('❌ فشل تحميل البيانات من JSONBin');
                    updateConnectionStatus(false);
                    return false;
                }
            } catch (error) {
                console.error('❌ خطأ في الاتصال بـ JSONBin:', error);
                updateConnectionStatus(false);
                return false;
            }
        }

        async function saveAllDataToJSONBin() {
            try {
                platformData.users = allUsers;
                platformData.lastUpdated = new Date().toISOString();
                
                const response = await fetch(`${JSONBIN_CONFIG.BASE_URL}/b/${JSONBIN_CONFIG.BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'X-Master-Key': JSONBIN_CONFIG.API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(platformData)
                });

                if (response.ok) {
                    console.log('✅ تم حفظ جميع البيانات في JSONBin');
                    console.log(`📊 حُفظ: ${platformData.users.length} مستخدم، ${platformData.messages.length} رسالة`);
                    return true;
                } else {
                    console.error('❌ فشل حفظ البيانات في JSONBin');
                    return false;
                }
            } catch (error) {
                console.error('❌ خطأ في حفظ البيانات:', error);
                return false;
            }
        }

        // Message storage functions
        async function saveMessage(message) {
            try {
                platformData.messages.push(message);
                const saved = await saveAllDataToJSONBin();
                
                if (saved) {
                    console.log('✅ تم حفظ الرسالة في JSONBin');
                    return { isOk: true };
                } else {
                    // Rollback
                    platformData.messages.pop();
                    return { isOk: false, error: 'فشل في حفظ الرسالة' };
                }
            } catch (error) {
                return { isOk: false, error: error.message };
            }
        }

        function getMessagesForChat(userId1, userId2) {
            return platformData.messages.filter(msg => 
                (msg.senderId === userId1 && msg.receiverId === userId2) ||
                (msg.senderId === userId2 && msg.receiverId === userId1)
            ).sort((a, b) => a.timestamp - b.timestamp);
        }

        // Chat room functions
        function getChatRoomId(userId1, userId2) {
            const ids = [userId1, userId2].sort();
            return `${ids[0]}_${ids[1]}`;
        }

        async function createOrUpdateChatRoom(userId1, userId2, lastMessage) {
            const roomId = getChatRoomId(userId1, userId2);
            const existingRoomIndex = platformData.chatRooms.findIndex(room => room.id === roomId);
            
            const roomData = {
                id: roomId,
                participants: [userId1, userId2],
                lastMessage: lastMessage,
                lastActivity: Date.now(),
                unreadCount: 0
            };

            if (existingRoomIndex >= 0) {
                platformData.chatRooms[existingRoomIndex] = roomData;
            } else {
                platformData.chatRooms.push(roomData);
            }

            return await saveAllDataToJSONBin();
        }

        async function createUser(userData) {
            try {
                // Generate unique ID
                const newUser = {
                    ...userData,
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 9)
                };

                allUsers.push(newUser);
                const saved = await saveAllDataToJSONBin();
                
                if (saved) {
                    updateUsersList();
                    console.log('✅ تم إنشاء مستخدم جديد:', newUser.name);
                    return { isOk: true, data: newUser };
                } else {
                    // Rollback
                    allUsers.pop();
                    return { isOk: false, error: 'فشل في حفظ المستخدم' };
                }
            } catch (error) {
                return { isOk: false, error: error.message };
            }
        }

        async function updateUser(userData) {
            try {
                const userIndex = allUsers.findIndex(u => u.id === userData.id);
                if (userIndex === -1) {
                    return { isOk: false, error: 'المستخدم غير موجود' };
                }

                const oldUser = { ...allUsers[userIndex] };
                allUsers[userIndex] = { ...userData };
                
                const saved = await saveAllDataToJSONBin();
                
                if (saved) {
                    updateUsersList();
                    console.log('✅ تم تحديث بيانات المستخدم:', userData.name);
                    return { isOk: true };
                } else {
                    // Rollback
                    allUsers[userIndex] = oldUser;
                    return { isOk: false, error: 'فشل في تحديث المستخدم' };
                }
            } catch (error) {
                return { isOk: false, error: error.message };
            }
        }

        // Data SDK Handler (Modified to work with JSONBin)
        const dataHandler = {
            onDataChanged(data) {
                // This will be called when we manually update the users list
                if (currentUser) {
                    updateUsersList();
                }
            }
        };

        // Initialize Data SDK (Modified)
        async function initDataSdk() {
            try {
                // Load all data from JSONBin
                const loaded = await loadAllDataFromJSONBin();
                
                if (loaded) {
                    // Initialize empty Data SDK for compatibility
                    if (window.dataSdk) {
                        const result = await window.dataSdk.init(dataHandler);
                        if (result.isOk) {
                            console.log('✅ تم تهيئة Data SDK');
                        }
                    }
                    
                    updateConnectionStatus(true);
                    console.log('✅ تم الاتصال بـ JSONBin بنجاح');
                    console.log(`📊 تم تحميل: ${platformData.users.length} مستخدم، ${platformData.messages.length} رسالة، ${platformData.chatRooms.length} محادثة`);
                    
                    // Start periodic sync
                    startPeriodicSync();
                    
                    return true;
                } else {
                    updateConnectionStatus(false);
                    console.error('❌ فشل الاتصال بـ JSONBin');
                    return false;
                }
            } catch (error) {
                updateConnectionStatus(false);
                console.error('❌ خطأ في تهيئة النظام:', error);
                return false;
            }
        }

        // Periodic sync with JSONBin
        function startPeriodicSync() {
            setInterval(async () => {
                if (currentUser) {
                    await loadAllDataFromJSONBin();
                    updateUsersList();
                    // Refresh current chat if open
                    if (currentChatUserId) {
                        loadMessages();
                    }
                }
            }, 30000); // Sync every 30 seconds
        }

        // Element SDK
        async function onConfigChange(newConfig) {
            config = { ...defaultConfig, ...newConfig };
            document.getElementById('academyNameDisplay').textContent = config.academy_name || defaultConfig.academy_name;
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [],
                    borderables: [],
                    fontEditable: undefined,
                    fontSizeable: undefined
                }),
                mapToEditPanelValues: (config) => new Map([
                    ['academy_name', config.academy_name || defaultConfig.academy_name],
                    ['teacher_name', config.teacher_name || defaultConfig.teacher_name]
                ])
            });
        }

        // Connection Status - Updated for user online/offline status
        function updateConnectionStatus(isOnline) {
            // This function now handles the overall connection to JSONBin
            console.log(isOnline ? '✅ متصل بالخادم' : '❌ غير متصل بالخادم');
        }

        // Update user online status
        async function updateUserOnlineStatus(userId, isOnline) {
            const userIndex = allUsers.findIndex(u => u.id === userId);
            if (userIndex >= 0) {
                allUsers[userIndex].isOnline = isOnline;
                allUsers[userIndex].lastSeen = Date.now();
                
                // Save to JSONBin
                await saveAllDataToJSONBin();
                
                // Update UI if this is the current user or in chat list
                if (currentUser && (userId === currentUser.id || currentChatUserId)) {
                    updateUsersList();
                }
            }
        }

        // Heartbeat system to maintain online status
        let heartbeatInterval = null;
        
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            
            heartbeatInterval = setInterval(async () => {
                if (currentUser) {
                    await updateUserOnlineStatus(currentUser.id, true);
                }
            }, 30000); // Update every 30 seconds
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        // Handle page visibility changes
        document.addEventListener('visibilitychange', async () => {
            if (currentUser) {
                if (document.hidden) {
                    // Page is hidden - user might be away
                    await updateUserOnlineStatus(currentUser.id, false);
                    stopHeartbeat();
                } else {
                    // Page is visible - user is back
                    await updateUserOnlineStatus(currentUser.id, true);
                    startHeartbeat();
                }
            }
        });

        // Handle page unload
        window.addEventListener('beforeunload', async () => {
            if (currentUser) {
                await updateUserOnlineStatus(currentUser.id, false);
            }
        });

        // DOM Elements
        const authScreen = document.getElementById('authScreen');
        const chatScreen = document.getElementById('chatScreen');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const showRegisterLink = document.getElementById('showRegister');
        const showLoginLink = document.getElementById('showLogin');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const chatList = document.getElementById('chatList');
        const attachImageBtn = document.getElementById('attachImageBtn');
        const attachFileBtn = document.getElementById('attachFileBtn');
        const imageInput = document.getElementById('imageInput');
        const fileInput = document.getElementById('fileInput');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeModal = document.getElementById('closeModal');
        const currentUserAvatar = document.getElementById('currentUserAvatar');
        const videoCallOverlay = document.getElementById('videoCallOverlay');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        // Utility Functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            setTimeout(() => {
                successMessage.classList.add('hidden');
            }, 3000);
        }

        function getInitials(name) {
            const words = name.trim().split(' ');
            if (words.length === 1) {
                return words[0].charAt(0).toUpperCase();
            }
            const firstLetter = words[0].charAt(0).toUpperCase();
            const lastLetter = words[words.length - 1].charAt(0).toUpperCase();
            return firstLetter + lastLetter;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' بايت';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' كيلوبايت';
            return (bytes / (1024 * 1024)).toFixed(1) + ' ميجابايت';
        }

        // Auto Login
        function saveLastUser(user) {
            localStorage.setItem('lastLoggedInUser', JSON.stringify({
                id: user.id,
                email: user.email,
                timestamp: Date.now()
            }));
        }

        function getLastUser() {
            const saved = localStorage.getItem('lastLoggedInUser');
            if (saved) {
                const userData = JSON.parse(saved);
                // Auto login if less than 30 days
                if (Date.now() - userData.timestamp < 30 * 24 * 60 * 60 * 1000) {
                    return userData;
                }
            }
            return null;
        }

        async function autoLogin() {
            const lastUser = getLastUser();
            if (lastUser && allUsers.length > 0) {
                const user = allUsers.find(u => u.id === lastUser.id && u.email === lastUser.email);
                if (user) {
                    currentUser = user;
                    
                    // Update user online status
                    await updateUserOnlineStatus(user.id, true);
                    currentUser.isOnline = true;
                    currentUser.lastSeen = Date.now();
                    
                    showChatScreen();
                    await loadChats();
                    
                    // Start heartbeat to maintain online status
                    startHeartbeat();
                    
                    return true;
                }
            }
            return false;
        }

        // Auth Functions
        showRegisterLink.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        });

        showLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'جاري تسجيل الدخول...';

            try {
                const user = allUsers.find(u => u.email === email && u.password === password);

                if (user) {
                    currentUser = user;
                    saveLastUser(user);
                    
                    // Update user online status
                    await updateUserOnlineStatus(user.id, true);
                    currentUser.isOnline = true;
                    currentUser.lastSeen = Date.now();
                    
                    showChatScreen();
                    await loadChats();
                    
                    // Start heartbeat to maintain online status
                    startHeartbeat();
                } else {
                    showError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
                }
            } catch (error) {
                showError('خطأ في تسجيل الدخول');
            }

            loginBtn.disabled = false;
            loginBtn.textContent = 'تسجيل الدخول';
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.textContent = 'جاري إنشاء الحساب...';

            try {
                if (allUsers.find(u => u.email === email)) {
                    showError('البريد الإلكتروني مستخدم بالفعل');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'إنشاء الحساب';
                    return;
                }

                const newUser = {
                    name,
                    email,
                    password,
                    avatar: null,
                    isTeacher: false,
                    isOnline: false,
                    lastSeen: Date.now(),
                    createdAt: Date.now()
                };

                const result = await createUser(newUser);

                if (result.isOk) {
                    showSuccess('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول');
                    registerForm.reset();
                    setTimeout(() => {
                        registerForm.classList.add('hidden');
                        loginForm.classList.remove('hidden');
                    }, 2000);
                } else {
                    showError(result.error || 'حدث خطأ أثناء إنشاء الحساب');
                }
            } catch (error) {
                showError('خطأ في إنشاء الحساب');
            }

            registerBtn.disabled = false;
            registerBtn.textContent = 'إنشاء الحساب';
        });

        function showChatScreen() {
            authScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');

            document.getElementById('currentUserName').textContent = currentUser.name;
            document.getElementById('currentUserEmail').textContent = currentUser.email;

            if (currentUser.avatar) {
                currentUserAvatar.innerHTML = `<img src="${currentUser.avatar}" alt="صورة المستخدم">`;
            } else {
                currentUserAvatar.textContent = getInitials(currentUser.name);
            }

            messagesContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>جاري تحميل البيانات...</p></div>';
        }

        logoutBtn.addEventListener('click', async () => {
            if (currentUser) {
                // Update user offline status
                await updateUserOnlineStatus(currentUser.id, false);
                // Stop heartbeat
                stopHeartbeat();
            }

            currentUser = null;
            currentChatUserId = null;
            chatScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            loginForm.reset();
            registerForm.reset();
            messagesContainer.innerHTML = '';
            chatList.innerHTML = '';
            
            // End any active calls
            if (isInCall) {
                endCall();
            }
        });

        // Avatar Upload
        currentUserAvatar.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const updatedUser = { ...currentUser, avatar: event.target.result };
                            const result = await updateUser(updatedUser);

        function updateUsersList() {
            chatList.innerHTML = '';
            
            let usersToShow = [];
            if (currentUser.isTeacher) {
                usersToShow = allUsers.filter(u => !u.isTeacher && u.id !== currentUser.id);
            } else {
                usersToShow = allUsers.filter(u => u.isTeacher);
            }

            usersToShow.forEach(user => {
                // Get last message for this chat
                const messages = getMessagesForChat(currentUser.id, user.id);
                const lastMessage = messages[messages.length - 1];
                
                let lastMessageText = '';
                let statusText = '';
                
                // Show online/offline status
                if (user.isOnline) {
                    statusText = '🟢 متصل الآن';
                } else {
                    const lastSeenDate = new Date(user.lastSeen);
                    const now = new Date();
                    const diffMinutes = Math.floor((now - lastSeenDate) / (1000 * 60));
                    
                    if (diffMinutes < 1) {
                        statusText = '🟡 آخر ظهور منذ لحظات';
                    } else if (diffMinutes < 60) {
                        statusText = `🟡 آخر ظهور منذ ${diffMinutes} دقيقة`;
                    } else if (diffMinutes < 1440) {
                        const hours = Math.floor(diffMinutes / 60);
                        statusText = `🔴 آخر ظهور منذ ${hours} ساعة`;
                    } else {
                        const days = Math.floor(diffMinutes / 1440);
                        statusText = `🔴 آخر ظهور منذ ${days} يوم`;
                    }
                }
                
                // Show last message if exists
                if (lastMessage) {
                    if (lastMessage.type === 'call') {
                        lastMessageText = lastMessage.text;
                    } else if (lastMessage.file) {
                        if (lastMessage.file.type === 'image') {
                            lastMessageText = '📷 صورة';
                        } else {
                            lastMessageText = `📎 ${lastMessage.file.name}`;
                        }
                    } else {
                        lastMessageText = lastMessage.text.length > 25 ? 
                            lastMessage.text.substring(0, 25) + '...' : 
                            lastMessage.text;
                    }
                    
                    // Add time to message
                    lastMessageText += ` • ${formatTime(lastMessage.timestamp)}`;
                } else {
                    lastMessageText = statusText;
                }

                const div = document.createElement('div');
                div.className = 'chat-list-item';
                div.innerHTML = `
                    <div class="chat-list-avatar">
                        ${user.avatar ? `<img src="${user.avatar}" alt="${user.name}">` : getInitials(user.name)}
                        ${user.isOnline ? '<div class="online-indicator"></div>' : ''}
                    </div>
                    <div class="chat-list-info">
                        <h4>${user.name}</h4>
                        <p>${lastMessageText}</p>
                    </div>
                `;
                div.addEventListener('click', () => selectChat(user.id));
                chatList.appendChild(div);
            });
        }

        function selectChat(userId) {
            currentChatUserId = userId;

            const items = chatList.querySelectorAll('.chat-list-item');
            items.forEach(item => item.classList.remove('active'));
            
            const selectedUser = allUsers.find(u => u.id === userId);
            if (selectedUser) {
                const userIndex = Array.from(chatList.children).findIndex(item => 
                    item.textContent.includes(selectedUser.name)
                );
                if (userIndex >= 0) {
                    chatList.children[userIndex].classList.add('active');
                }
            }

            loadMessages();
        }

        function loadMessages() {
            if (!currentChatUserId) {
                showEmptyState();
                return;
            }

            // Get messages for current chat
            const messages = getMessagesForChat(currentUser.id, currentChatUserId);
            
            messagesContainer.innerHTML = '';
            
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <h3>ابدأ المحادثة</h3>
                        <p>اكتب رسالة أو ابدأ مكالمة صوتية أو فيديو</p>
                    </div>
                `;
            } else {
                messages.forEach(message => {
                    renderMessage(message);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function renderMessage(message) {
            const div = document.createElement('div');
            div.className = `message ${message.senderId === currentUser.id ? 'sent' : 'received'}`;

            const sender = allUsers.find(u => u.id === message.senderId);
            const senderInitials = sender ? getInitials(sender.name) : '?';

            let content = message.text;
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            content = content.replace(urlRegex, (url) => {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="message-link">${url}</a>`;
            });

            let fileHtml = '';
            if (message.file) {
                if (message.file.type === 'image') {
                    fileHtml = `<img src="${message.file.data}" alt="صورة" class="message-image" onclick="openImageModal('${message.file.data}')">`;
                } else {
                    fileHtml = `
                        <div class="message-file">
                            <div class="file-icon">📄</div>
                            <div class="file-info">
                                <div class="file-name">${message.file.name}</div>
                                <div class="file-size">${message.file.size}</div>
                            </div>
                        </div>
                    `;
                }
            }

            div.innerHTML = `
                ${message.senderId !== currentUser.id ? `<div class="message-avatar">${sender && sender.avatar ? `<img src="${sender.avatar}" alt="${sender.name}">` : senderInitials}</div>` : ''}
                <div class="message-bubble">
                    <div>${content}</div>
                    ${fileHtml}
                    <div class="message-time">${formatTime(message.timestamp)}</div>
                </div>
                ${message.senderId === currentUser.id ? `<div class="message-avatar">${currentUser.avatar ? `<img src="${currentUser.avatar}" alt="${currentUser.name}">` : getInitials(currentUser.name)}</div>` : ''}
            `;

            messagesContainer.appendChild(div);
        }
